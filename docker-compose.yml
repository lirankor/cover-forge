services:
  cover-forge:
    build: .
    image: cover-forge:local
    container_name: cover-forge
    restart: unless-stopped
    mem_limit: 512m
    # Chromium needs more than Docker's default 64 MB /dev/shm
    shm_size: 256m
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8793"
    # uid:gid that owns ./data on the host (see .env.example)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - ./data:/data
